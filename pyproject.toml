[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "group3-paper-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "lxml>=5.3,<7", "pydantic>=2.11.3,<3", "pydantic-settings>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]
a2a = ["a2a-sdk[http-server]>=1.3,<2", "uvicorn>=0.54,<1"]
supervisor = ["groq>=1.7,<2", "chromadb>=1.5,<2", "aiosqlite>=0.22,<1"]
group2 = ["aiosqlite>=0.20,<1", "fastapi>=0.110,<1", "google-genai>=1.0,<2", "uvicorn[standard]>=0.29,<1"]

[project.scripts]
group3-retrieve = "group3.cli:main"
group3-analyze = "group3.analysis_cli:main"

[tool.setuptools.packages.find]
include = ["group3*", "supervisor*", "a2a_agents*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: external service integration; opt in with RUN_LIVE=1"]
